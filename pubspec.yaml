name: flutter_template
description: Rite Labs production Flutter template. Clone ? configure ? ship.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # -- State Management --------------------------------------
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5

  # -- Navigation --------------------------------------------
  go_router: ^14.2.0

  # -- Networking --------------------------------------------
  dio: ^5.4.3
  retrofit: 4.8.0
  pretty_dio_logger: ^1.3.1

  # -- Data Models -------------------------------------------
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # -- Local Storage -----------------------------------------
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # -- Firebase (tree-shaken — enable per-app in CLAUDE.md) --
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_analytics: ^11.3.0
  firebase_crashlytics: ^4.1.0
  firebase_messaging: ^15.1.0
  firebase_remote_config: ^5.1.0

  # -- Auth -------------------------------------------------
  google_sign_in: ^6.2.1

  # -- Monetization -----------------------------------------
  purchases_flutter: ^8.0.0   # RevenueCat

  # -- Animations -------------------------------------------
  lottie: ^3.1.2
  rive: ^0.13.9
  flutter_animate: ^4.5.0
  animations: ^2.0.11

  # -- UI Components ----------------------------------------
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1

  # -- Splash Screen ----------------------------------------
  flutter_native_splash: ^2.4.1

  # -- Permissions & Device ---------------------------------
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

  # -- Notifications ----------------------------------------
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # -- Utilities --------------------------------------------
  logger: ^2.4.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  intl: ^0.20.2
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # -- Code Generation --------------------------------------
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.4.7
  json_serializable: ^6.8.0
  retrofit_generator: ^9.7.0

  # -- Testing ----------------------------------------------
  mocktail: ^1.0.4
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
    - .env

  fonts:
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/ClashDisplay-Regular.ttf
        - asset: assets/fonts/ClashDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/ClashDisplay-Semibold.ttf
          weight: 600
        - asset: assets/fonts/ClashDisplay-Bold.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500






